<style>
:root{
  --navy:#161A3C; --navy2:#232a5c; --green:#6BAB20; --green-d:#578d18; --green-l:#eef6e4;
  --bg:#f4f6f9; --card:#fff; --line:#e3e7ee; --text:#1d2235; --muted:#6b7389;
  --red:#d64545; --red-l:#fdecec; --amber:#c98a06; --amber-l:#fff6e0; --blue:#2f6fd6; --blue-l:#e8f0fd; --gray-l:#eef0f4;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Cairo',Tahoma,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--blue);text-decoration:none}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:240px;background:var(--navy);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{background:#fff;padding:14px 16px;border-bottom:4px solid var(--green)}
.brand img{width:100%;display:block}
.nav{padding:10px 8px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;color:#cfd4ea;padding:9px 12px;border-radius:9px;margin-bottom:2px;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.on{background:var(--green);color:#fff}
.nav .ic{width:22px;text-align:center;font-size:17px}
.nav .cnt{margin-inline-start:auto;background:var(--red);color:#fff;border-radius:20px;font-size:12px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{padding:12px 16px;font-size:12px;color:#9aa1c2;border-top:1px solid rgba(255,255,255,.08);direction:ltr;text-align:right}
.main{flex:1;min-width:0;padding:24px 28px 60px}
/* top bar mobile */
.topbar{display:none}
@media (max-width:900px){
  body{font-size:15.5px;-webkit-tap-highlight-color:transparent}
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;background:none}
  .brand{display:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:3px solid var(--green);position:sticky;top:0;z-index:20}
  .topbar img{height:34px}
  /* bottom tab bar */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;overflow-x:auto;background:var(--navy);padding:4px 4px calc(4px + env(safe-area-inset-bottom));white-space:nowrap;box-shadow:0 -4px 14px rgba(0,0,0,.18);scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a{flex:1 0 auto;min-width:68px;flex-direction:column;gap:0;margin:0 1px;padding:5px 6px;font-size:11px;text-align:center;justify-content:center;position:relative;line-height:1.3}
  .nav .ic{font-size:20px;width:auto}
  .nav .cnt{position:absolute;top:1px;left:8px;font-size:10px;padding:0 5px;min-width:16px}
  .nav .who{display:none}
  .side-foot{display:none}
  .main{padding:14px 10px calc(86px + env(safe-area-inset-bottom))}
  .page-head h1{font-size:20px}
  .btn{padding:9px 14px}
  .btn.sm{padding:6px 11px}
  .modal{padding:0;align-items:flex-end}
  .modal-box{border-radius:16px 16px 0 0;max-height:94vh;display:flex;flex-direction:column}
  .modal-box form{overflow-y:auto;display:flex;flex-direction:column;min-height:0}
  .form{overflow-y:auto}
  .form-foot{position:sticky;bottom:0;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-radius:0}
  .f input,.f select,.f textarea{font-size:16px;padding:10px 12px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:10px 12px}.stat .n{font-size:24px}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom))!important}
  /* tables become cards */
  .table-wrap{background:none;border:0;overflow:visible}
  .table-wrap table,.table-wrap tbody,.table-wrap tr,.table-wrap td{display:block;width:100%}
  .table-wrap thead{display:none}
  .table-wrap tr{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
  .table-wrap td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:left}
  .table-wrap td::before{content:attr(data-label);color:var(--muted);font-size:12.5px;font-weight:700;text-align:right;flex-shrink:0}
  .table-wrap td[data-label=""]::before{display:none}
  .table-wrap td[data-label=""]{justify-content:flex-start;padding-top:8px;margin-top:4px;border-top:1px dashed var(--line)}
  .table-wrap td>*:only-child{text-align:left}
  .table-wrap .empty{background:#fff;border:1px solid var(--line);border-radius:12px}
  .user-m{display:flex!important}
}
.divsw{display:flex;gap:4px;padding:8px 10px;background:rgba(255,255,255,.06)}
.divsw button{flex:1;border:0;border-radius:8px;padding:6px 4px;font-weight:700;font-size:13px;cursor:pointer;background:rgba(255,255,255,.1);color:#cfd4ea}
.divsw button.on{background:#fff;color:var(--navy)}
.top-sw{display:none}
@media (max-width:900px){.side-sw{display:none}.top-sw{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:53px;z-index:19}.top-sw button{background:var(--gray-l);color:var(--muted)}.top-sw button.on{background:var(--navy);color:#fff}}
@media print{.divsw{display:none!important}}
.oblbox{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:#fafbfc}
.oblbox.on{border-color:var(--green);background:#fff}
.oblhead{display:flex!important;align-items:center;gap:6px;cursor:pointer;margin:0!important}.oblhead input{width:auto!important}
.oblbody{display:none;margin-top:10px}.oblbox.on .oblbody{display:block}
.wa-ic{font-size:9px;vertical-align:middle}
.user-m{display:none;align-items:center;gap:8px;font-size:12px}
.install-bar{display:none;background:var(--green-l);border:1px solid var(--green);border-radius:12px;padding:10px 14px;margin-bottom:14px;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.install-bar.show{display:flex}
/* page */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h1{margin:0;font-size:24px;color:var(--navy)}
.page-head .sub{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#c5ccd9}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover{background:var(--green-d)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--red)}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.btn.sm{padding:3px 9px;font-size:13px;border-radius:7px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 12px;color:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
@media (max-width:500px){.g2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;border-top:4px solid var(--green)}
.stat .n{font-size:30px;font-weight:800;color:var(--navy);line-height:1.2}
.stat .l{color:var(--muted);font-size:14px;font-weight:600}
.stat.red{border-top-color:var(--red)} .stat.red .n{color:var(--red)}
.stat.amber{border-top-color:var(--amber)}
.stat.navy{border-top-color:var(--navy)}
.stat.blue{border-top-color:var(--blue)}
/* toolbar & table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:9px;padding:7px 12px;background:#fff}
.toolbar input[type=search]{flex:1;min-width:200px}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f7f8fb;color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfd}
td.nowrap{white-space:nowrap}
th{position:relative}
th .rz{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:2}
th .rz::after{content:'';position:absolute;top:25%;right:3px;height:50%;border-right:2px solid #d5dae4}
th:hover .rz::after,th .rz:hover::after{border-color:var(--green)}
body.resizing,body.resizing *{cursor:col-resize!important;user-select:none!important}
td{overflow-wrap:anywhere}
@media (min-width:901px){
 td.wrap,td.wrap *{white-space:normal!important;overflow-wrap:anywhere;word-break:break-word}
 td.wrap .btns{flex-wrap:wrap}
 td.wrap .btn{white-space:normal!important;text-align:center}
 td.wrap .prog{width:100%;max-width:90px}
 th{white-space:normal}
}
.side-rz{position:absolute;top:0;left:-4px;width:8px;height:100%;cursor:col-resize;z-index:25}
.side-rz:hover{background:rgba(107,171,32,.35)}
@media (max-width:900px){.side-rz{display:none}}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--navy);background:#eef1f6}th .arr{color:#b3bacb;font-size:11px}th.sortable:hover .arr{color:var(--green)}
.ref{font-family:Consolas,monospace;direction:ltr;unicode-bidi:embed;font-weight:700;color:var(--navy);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{text-align:center;color:var(--muted);padding:28px}
.badge{display:inline-block;padding:1px 10px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--gray-l);color:#555}
.b-green{background:var(--green-l);color:var(--green-d)}
.b-red{background:var(--red-l);color:var(--red)}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-blue{background:var(--blue-l);color:var(--blue)}
.b-purple{background:#f1e9fb;color:#7a3fc4}
.b-navy{background:#e6e8f3;color:var(--navy)}
.prog{background:var(--gray-l);border-radius:10px;height:8px;width:90px;overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--green)}
.list-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:center}
.list-item:last-child{border-bottom:0}
.list-item .t{font-weight:700}
/* client header */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px}
.info-grid div b{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
/* daily */
.day-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-nav input{border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.tech-card{border-top:4px solid var(--navy)}
.tech-card h3{margin:0;font-size:17px;color:var(--navy)}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,18,40,.55);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:30px 10px;overflow-y:auto}
.modal.hidden{display:none}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;color:var(--navy)}
.x{border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted);line-height:1}
.form{padding:16px 18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
@media (max-width:600px){.fgrid{grid-template-columns:1fr}}
.f.full{grid-column:1/-1}
.f label{display:block;font-weight:700;font-size:13.5px;margin-bottom:3px;color:#3a4160}
.f label .req{color:var(--red)}
.f input,.f select,.f textarea{width:100%;border:1px solid #d5dae4;border-radius:9px;padding:8px 11px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--green-l);border-color:var(--green)}
.f textarea{min-height:76px;resize:vertical}
.form-foot{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px;border-top:1px solid var(--line);background:#fafbfc;border-radius:0 0 14px 14px}
.refbox{background:var(--green-l);border:1px dashed var(--green);border-radius:9px;padding:6px 12px;margin-bottom:12px;font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;z-index:200;font-weight:600;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
.alert{background:var(--amber-l);border:1px solid #f0d58a;color:#7a5a00;border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* print */
#printArea{display:none}
.print-head{display:none}
@media print{
  body{background:#fff;font-size:13px}
  .side,.topbar,.no-print,.btn,.toolbar,.modal,.toast,.alert{display:none!important}
  .main{padding:0}
  .card,.table-wrap{border:1px solid #ccc;break-inside:avoid}
  .print-head{display:flex!important;justify-content:space-between;align-items:center;border-bottom:3px solid var(--green);padding-bottom:8px;margin-bottom:14px}
  .print-head img{height:50px}
  body.print-single .app{display:none!important}
  body.print-single #printArea{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.rep{max-width:780px;margin:auto}
.rep-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--green);padding-bottom:10px;margin-bottom:16px}
.rep-head img{height:60px}
.rep h2{text-align:center;color:var(--navy);margin:6px 0 14px}
.rep table td,.rep table th{border:1px solid #bbb}
.rep .box{border:1px solid #bbb;min-height:90px;padding:8px;border-radius:6px;white-space:pre-wrap;margin-bottom:12px}
.sign{display:flex;justify-content:space-between;margin-top:40px;gap:30px}
.sign div{flex:1;border-top:1px solid #333;text-align:center;padding-top:6px}
</style>
</head>

function nextClientRef(div='hvac'){

const LETTER={contracts:'C',visits:'V',jobs:'J'};
const EXPIRY_DAYS=60;
const isAuto=c=>c.autoRenew==='yes'&&!['ملغي','معلق','لن يُجدد'].includes(c.status);
function currentEnd(c){if(!c.end)return'';let e=c.end;const t=today();if(isAuto(c)){const m=Number(c.renewMonths)||12;let g=0;while(e<t&&g++<60)e=addDays(addMonths(addDays(e,1),m),-1)}return e}
const renewedTimes=c=>{let e=c.end,n=0;const ce=currentEnd(c),m=Number(c.renewMonths)||12;while(e&&e<ce&&n<60){e=addDays(addMonths(addDays(e,1),m),-1);n++}return n};
const noticeDays=c=>{const v=Number(c.noticeValue)||0;return c.noticeUnit==='يوم'?v:Math.round(v*30)};
const noticeDate=c=>noticeDays(c)?addDays(currentEnd(c),-noticeDays(c)):'';
const daysLeft=c=>Math.round((parse(currentEnd(c))-parse(today()))/864e5);
const decisionDays=c=>daysLeft(c)-noticeDays(c);
const expiringContracts=()=>db.contracts.filter(c=>contractStatus(c)==='ساري'&&c.end&&decisionDays(c)<=EXPIRY_DAYS).sort((a,b)=>decisionDays(a)-decisionDays(b));
const expiryText=c=>noticeDays(c)?`آخر موعد للإخطار ${fmt(noticeDate(c))} · باقي <b style="color:${decisionDays(c)<=30?'var(--red)':'var(--amber)'}">${Math.max(0,decisionDays(c))} يوم</b>${decisionDays(c)<0?' <b style="color:var(--red)">(فات موعد الإخطار)</b>':''}`:`ينتهي ${fmt(currentEnd(c))} · <b style="color:${daysLeft(c)<=30?'var(--red)':'var(--amber)'}">باقي ${daysLeft(c)} يوم</b>`;

}

  if(c.status==='ملغي'||c.status==='معلق')return c.status;

const hasPicker=()=>'contacts' in navigator&&'select' in navigator.contacts;
const normPhone=p=>{let n=String(p||'').replace(/[^\d+]/g,'');if(n.startsWith('+20'))n='0'+n.slice(3);else if(n.startsWith('0020'))n='0'+n.slice(4);else if(/^20(1\d{9})$/.test(n))n='0'+n.slice(2);return n};

function qpDecode(v){try{return decodeURIComponent(v.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/gi,'%$1'))}catch(e){return v}}
function parseVcf(txt){
  const lines=txt.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,'').replace(/=\r?\n/g,'').split(/\r?\n/);const c={tels:[]};
  for(const ln of lines){const i=ln.indexOf(':');if(i<0)continue;const head=ln.slice(0,i).toUpperCase(),prop=head.split(';')[0].replace(/^ITEM\d+\./,'');let val=ln.slice(i+1);
    if(/QUOTED-PRINTABLE/.test(head))val=qpDecode(val);val=val.replace(/\\,/g,',').replace(/\\;/g,';').trim();
    if(prop==='FN'&&!c.name)c.name=val;
    else if(prop==='N'&&!c.nameN)c.nameN=val.split(';').filter(Boolean).reverse().join(' ');
    else if(prop==='TEL'&&val)c.tels.push(val);
    else if(prop==='EMAIL'&&!c.email)c.email=val;
    else if(prop==='ORG'&&!c.org)c.org=val.split(';')[0];
    else if(prop==='TITLE'&&!c.title)c.title=val;
    if(prop==='END'&&c.name)break}
  c.name=c.name||c.nameN;return c;
}
function vcfPicked(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const c=parseVcf(String(r.result));if(!c.name&&!c.tels.length)return toast('لم يتم العثور على بيانات في الملف');fillContact(c)};r.readAsText(f);inp.value=''}

  const set=(k,v)=>{const el=$('#f_'+k);if(el&&v)el.value=v};const tels=[...new Set((c.tels||[]).map(normPhone).filter(Boolean))];
  if(formCtx.key==='clients'){

    set('contactTitle',c.title);set('phone',tels[0]);set('phone2',tels[1]);set('email',c.email);
  }else{set('name',c.name);set('phone',tels[0]);if(c.email&&/@gmail\.com$/i.test(c.email))set('email',c.email.toLowerCase())}
  toast('تم إدخال بيانات جهة الاتصال ✅ راجعها ثم احفظ');
}

  const o=byId(key,id);if(!o)return;
  if(key==='clients'){
    const rel=['contracts','visits','jobs','logs','invoices','letters'].reduce((s,k)=>s+db[k].filter(x=>x.clientId===id).length,0);
    if(!confirm(`حذف العميل "${o.name}" (${o.ref})؟`+(rel?`\nسيتم حذف ${rel} سجل مرتبط به (عقود/زيارات/أعمال).`:'')))return;
    db.contracts.filter(x=>x.clientId===id&&x.attachment).forEach(x=>Files.del(x.attachment.id));
    [...db.jobs,...db.visits].filter(x=>x.clientId===id).forEach(x=>(x.attachments||[]).forEach(a=>Files.del(a.id)));
    db.invoices.filter(x=>x.clientId===id).forEach(r=>{(r.attachments||[]).forEach(a=>Files.del(a.id));oblOn(r).forEach(k=>(r.oblig[k].files||[]).forEach(a=>Files.del(a.id)))});
    (db.letters||[]).filter(x=>x.clientId===id).forEach(x=>(x.attachments||[]).forEach(a=>Files.del(a.id)));
    ['contracts','visits','jobs','logs','invoices','letters'].forEach(k=>{db[k].filter(x=>x.clientId===id).forEach(x=>drop(k,x.id));db[k]=db[k].filter(x=>x.clientId!==id)});
    db.clients=db.clients.filter(x=>x.id!==id);drop('clients',id);location.hash='#/clients';toast('تم الحذف');return render();
  }
  if(key==='contracts'){const vs=db.visits.filter(v=>v.contractId===id&&v.status==='مجدولة');
    if(!confirm(`حذف العقد ${o.no}؟`+(vs.length?`\nسيتم حذف ${vs.length} زيارة مجدولة لم تتم.`:'')))return;
    vs.forEach(v=>drop('visits',v.id));if(o.attachment)Files.del(o.attachment.id);
    db.visits=db.visits.filter(v=>!(v.contractId===id&&v.status==='مجدولة'));db.visits.forEach(v=>{if(v.contractId===id){v.contractId='';put('visits',v)}});}
  else if(!confirm('تأكيد الحذف؟'))return;
  if(key==='jobs'||key==='visits')(o.attachments||[]).forEach(a=>Files.del(a.id));
  if(key==='jobs'&&(db.jobPrices||[]).some(x=>x.id===id)){db.jobPrices=db.jobPrices.filter(x=>x.id!==id);drop('jobPrices',id)}
  if(key==='letters')(o.attachments||[]).forEach(a=>Files.del(a.id));
  if(key==='invoices'){(o.attachments||[]).forEach(a=>Files.del(a.id));oblOn(o).forEach(k=>(o.oblig[k].files||[]).forEach(a=>Files.del(a.id)))}
  db[key]=db[key].filter(x=>x.id!==id);
  if(key==='techs'){['visits','jobs','logs'].forEach(k=>db[k].forEach(x=>{if(x.techId===id){x.techId='';put(k,x)}}));if(MODE==='cloud'&&o.email)Cloud.delUser(o.email)}
  drop(key,id);toast('تم الحذف');render();
}

function sendWA(techId){
  const t=tech(techId),d=ui.dailyDate||today();
  const vs=db.visits.filter(v=>v.date===d&&v.techId===techId&&!['ملغاة','تمت'].includes(v.status));
  const js=db.jobs.filter(j=>j.techId===techId&&['جديد','جاري التنفيذ'].includes(j.status));
  let m=`السلام عليكم ${t.name}\nمهام يوم ${dayName(d)} ${fmt(d)}:\n`;
  if(vs.length){m+=`\n🔧 زيارات الصيانة:\n`;vs.forEach((v,i)=>{const c=cl(v.clientId)||{};m+=`${i+1}- ${c.name} (${v.no}) - ${v.type}${v.time?' - الساعة '+v.time:''}\n   📍 ${c.address||c.area||''}${c.location?'\n   '+c.location:''}\n   📞 ${c.contact?c.contact+' ':''}${c.phone||''}\n`})}
  if(js.length){m+=`\n🏗️ الأعمال:\n`;js.forEach((j,i)=>{const c=cl(j.clientId)||{};m+=`${i+1}- ${j.title} - ${c.name} (${j.no})${j.due?' - التسليم '+fmt(j.due):''}\n`})}
  if(!vs.length&&!js.length)m+='لا توجد مهام مسجلة.\n';
  m+=`\nبرجاء إرسال تقرير بما تم في نهاية اليوم.\n${db.settings.company}`;
  if(!t.phone){navigator.clipboard?.writeText(m);toast('لا يوجد رقم للفني — تم نسخ الرسالة');return}
  window.open(`https://wa.me/${waNum(t.phone)}?text=${encodeURIComponent(m)}`,'_blank');
}

async function mergeImport(d,b){
  const fresh=!db.clients.length;const remap={};
  for(const c of d.clients){
    const ex=cl(c.id);

    else if(!c.ref||db.clients.some(x=>x.ref===c.ref)){const nr=nextClientRef(clDiv(c));c.seq=nr.seq;c.ref=nr.ref;remap[c.id]=1}
    upsert('clients',c);
  }
  for(const k of ['contracts','visits','jobs']){for(const o of d[k]){const c=cl(o.clientId);
    if(c&&(remap[o.clientId]||!o.no)){if(!o.n)o.n=childNo(k,o.clientId).n;o.no=`${c.ref}/${LETTER[k]}${o.n}`}upsert(k,o)}}
  for(const j of d.jobs||[])if('value' in j){(d.jobPrices=d.jobPrices||[]).push({id:j.id,value:j.value});delete j.value;const x=byId('jobs',j.id);if(x)delete x.value}
  for(const k of ['techs','logs','invoices','jobPrices','letters'])(d[k]||[]).forEach(o=>upsert(k,o));
  if(fresh&&d.settings)db.settings={...b.settings,...d.settings};
  for(const fl of d.files||[])await Files.put(fl.id,b64ToBlob(fl.data,fl.type),fl.kind||'contract');
  if(MODE==='cloud'){await Cloud.bulk(['clients','techs','contracts','visits','jobs','logs','invoices','jobPrices','letters'].flatMap(k=>(d[k]||[]).map(o=>[k,byId(k,o.id)])));
    d.techs.filter(t=>t.email).forEach(t=>Cloud.setUser(t.email,{email:t.email,role:'tech',techId:t.id,name:t.name}));if(fresh)putSettings()}
  else save();
  toast('تم الاستيراد بنجاح ✅');render();
}

function idbStore(mode,fn){return new Promise((res,rej)=>{const o=indexedDB.open('delta_files',1);o.onupgradeneeded=()=>o.result.createObjectStore('files');
  o.onerror=()=>rej(o.error);o.onsuccess=()=>{const tx=o.result.transaction('files',mode),rq=fn(tx.objectStore('files'));tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error)}})}

async function shrink(file){
  if(!/^image\//.test(file.type)||file.size<500*1024)return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));return b&&b.size<file.size?new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'}):file}catch(e){return file}
}

    const big=matchMedia('(min-width:900px)').matches;
    $('#fileView').outerHTML=`<div class="form">${img?`<img src="${url}" style="max-width:100%;border-radius:8px;border:1px solid var(--line)">`:big?`<iframe src="${url}" style="width:100%;height:65vh;border:1px solid var(--line);border-radius:8px"></iframe>`:`<div style="font-size:60px;text-align:center">📄</div><p class="small muted" style="text-align:center">${esc(meta.name)}${meta.size?' · '+fsize(meta.size):''}</p>`}</div>
     <div class="form-foot"><a class="btn primary" href="${url}" target="_blank" rel="noopener">فتح الملف</a><a class="btn" href="${url}" download="${esc(meta.name)}">⬇️ تنزيل</a><button type="button" class="btn" onclick="closeModal()">إغلاق</button></div>`;
  }).catch(()=>{$('#fileView').innerHTML='<span style="color:var(--red)">تعذّر تحميل الملف — تأكد من الاتصال بالإنترنت</span>'});
}

/* ===================== Mobile app (PWA) ===================== */
let installEvt=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installBar(){
  if(standalone()||localStorage.getItem?.('delta_install_hide'))return'';
  if(installEvt)return`<div class="install-bar show no-print"><span>📱 ثبّت البرنامج على الموبايل كتطبيق (أيقونة على الشاشة الرئيسية ويعمل بدون إنترنت)</span><div class="btns"><button class="btn sm primary" onclick="doInstall()">تثبيت التطبيق</button><button class="btn sm" onclick="hideInstall()">لاحقاً</button></div></div>`;
  if(isIOS())return`<div class="install-bar show no-print"><span>📱 لتثبيت البرنامج على الآيفون: افتحه من <b>Safari</b> ← اضغط زر المشاركة <b>⬆️</b> ← <b>إضافة إلى الشاشة الرئيسية</b></span><button class="btn sm" onclick="hideInstall()">حسناً</button></div>`;
  return'';
}
function hideInstall(){try{localStorage.setItem('delta_install_hide','1')}catch(e){}render()}
async function doInstall(){if(!installEvt)return;installEvt.prompt();const r=await installEvt.userChoice;installEvt=null;if(r.outcome==='accepted')toast('تم تثبيت التطبيق ✅');render()}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
window.addEventListener('appinstalled',()=>{installEvt=null;render()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ===================== Contract expiry notifications ===================== */
function notifyBtn(){return('Notification' in window)&&Notification.permission==='default'?`<button class="btn sm navy" onclick="enableNotify()">🔔 تفعيل التنبيهات</button>`:''}
async function enableNotify(){try{const r=await Notification.requestPermission();toast(r==='granted'?'تم تفعيل التنبيهات ✅':'لم يتم السماح بالتنبيهات');if(r==='granted'){try{localStorage.removeItem('delta_notified')}catch(e){}checkExpiryNotify()}render()}catch(e){}}
async function checkExpiryNotify(){
  if(!isMgr()||!('Notification' in window)||Notification.permission!=='granted')return;
  let last='';try{last=localStorage.getItem('delta_notified')||''}catch(e){}if(last===today())return;
  const ex=expiringContracts();if(!ex.length)return;
  const body=ex.slice(0,5).map(c=>`${clName(c.clientId)} (${c.no}) — باقي ${daysLeft(c)} يوم`).join('\n')+(ex.length>5?`\n+ ${ex.length-5} أخرى`:'');
  const title=`⏰ ${ex.length} عقد ينتهي خلال ${EXPIRY_DAYS} يوم`,opt={body,icon:'icon-192.png',badge:'icon-192.png',tag:'delta-expiry',dir:'rtl',lang:'ar'};
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.showNotification(title,opt);else new Notification(title,opt)}catch(e){try{new Notification(title,opt)}catch(_){}}
  try{localStorage.setItem('delta_notified',today())}catch(e){}
}

/* ===================== Sign-in gate & Firebase ===================== */
function gate(html){
  let g=$('#gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
  if(!html){g.remove();document.querySelector('.app').style.display='';return}
  document.querySelector('.app').style.display='none';
  g.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#161A3C 0%,#232a5c 60%,#3b5a1c 100%)">
   <div class="card" style="max-width:420px;width:100%;text-align:center;padding:30px 26px;border-top:5px solid var(--green)"><img src="${LOGO}" style="width:80%;max-width:300px;margin-bottom:14px">${html}</div></div>`;
}
const G_BTN=`<button class="btn" style="width:100%;justify-content:center;padding:11px;font-size:16px;border-color:#c9cfdc" onclick="Cloud.login()"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg> تسجيل الدخول بحساب Google</button>`;
const showLogin=()=>gate(`<h2 style="justify-content:center">برنامج متابعة الأعمال والصيانة</h2><p class="muted small">للمدير والفنيين — ادخل بحساب Gmail المسجل لدى الشركة</p>${G_BTN}`);
const showDenied=e=>gate(`<h2 style="justify-content:center;color:var(--red)">الحساب غير مسجل</h2><p class="small">الحساب <b dir="ltr">${esc(e)}</b> ليس له صلاحية دخول.<br>اطلب من المدير إضافة هذا البريد في بيانات الفني.</p><button class="btn" onclick="Cloud.logout()">الدخول بحساب آخر</button>`);
const SYNC={pending:{},failed:[]};
const ENT_NAME={letters:'خطاب',clients:'عميل',techs:'فني',contracts:'عقد',visits:'زيارة',jobs:'عمل',logs:'سجل يومي',invoices:'فاتورة'};
const syncLabel=(k,o)=>`${ENT_NAME[k]||k} ${o&&(o.invNo||o.no||o.ref||o.name||o.title)||''}`.trim();
function syncBanner(){
  const pend=Object.values(SYNC.pending).reduce((a,b)=>a+b,0);let h='';
  if(SYNC.failed.length)h+=`<div class="alert no-print" style="background:var(--red-l);border-color:#f3b4b4;color:#8a1f1f"><span>❌ <b>لم يتم حفظ ${SYNC.failed.length} عنصر على السحابة</b> — لن يراها باقي المستخدمين:<br>${SYNC.failed.slice(-5).map(f=>`• ${esc(f.label)} — ${esc(f.why)} (${f.at})`).join('<br>')}</span><button class="btn sm" onclick="SYNC.failed=[];render()">إخفاء</button></div>`;
  if(pend)h+=`<div class="alert no-print"><span>⏳ ${pend} تغيير لم يُرفع للسحابة بعد — تأكد من الاتصال بالإنترنت، وسيتم الرفع تلقائياً.</span></div>`;
  return h;
}
function migrateJobValues(){
  const old=db.jobs.filter(j=>'value' in j);if(!old.length)return;
  old.forEach(j=>{const v=j.value;delete j.value;if(v!==''&&v!=null&&!(db.jobPrices||[]).some(x=>x.id===j.id)){const rec={id:j.id,value:v};db.jobPrices.push(rec);put('jobPrices',rec)}put('jobs',j)});
}
let _rt;function scheduleRender(){clearTimeout(_rt);_rt=setTimeout(render,120)}

async function startCloud(){
  gate(`<p class="muted">جاري التحميل...</p>`);
  const V='https://www.gstatic.com/firebasejs/10.12.2/';
  let A,AU,FS;
  try{[A,AU,FS]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')])}
  catch(e){gate(`<p style="color:var(--red)">تعذّر الاتصال بالإنترنت. تأكد من الاتصال ثم أعد تحميل الصفحة.</p><button class="btn" onclick="location.reload()">إعادة المحاولة</button>`);return}
  const app=A.initializeApp(FIREBASE_CONFIG),auth=AU.getAuth(app);
  let fdb;try{fdb=FS.initializeFirestore(app,{localCache:FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})})}catch(e){fdb=FS.getFirestore(app)}
  const fail=(e,k,o)=>{console.error(e);const why=e.code==='permission-denied'?'ليس لديك صلاحية (قواعد Firebase)':e.code||e.message;
    if(k){SYNC.failed.push({k,label:syncLabel(k,o),why,at:new Date().toLocaleTimeString('ar-EG')});scheduleRender()}
    toast('❌ لم يتم الحفظ: '+why)};
  const clean=o=>JSON.parse(JSON.stringify(o));
  const prov=new AU.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  let unsubs=[];
  Cloud={
    set:(k,o)=>FS.setDoc(FS.doc(fdb,k,o.id),clean(o)).catch(e=>fail(e,k,o)),
    del:(k,id)=>FS.deleteDoc(FS.doc(fdb,k,id)).catch(e=>fail(e,k,{id})),
    setSettings:s=>FS.setDoc(FS.doc(fdb,'meta','settings'),clean(s)).catch(fail),
    setUser:(e,d)=>FS.setDoc(FS.doc(fdb,'users',e),d).catch(fail),
    delUser:e=>FS.deleteDoc(FS.doc(fdb,'users',e)).catch(fail),
    putFile:async(id,b64,type,kind='contract')=>{const CH=700000,n=Math.ceil(b64.length/CH);const bt=FS.writeBatch(fdb);
      for(let i=0;i<n;i++)bt.set(FS.doc(fdb,'files',`${id}_${i}`),{fileId:id,kind,i,n,type:type||'',data:b64.slice(i*CH,(i+1)*CH)});await bt.commit()},
    getFile:async id=>{const q=await FS.getDocs(isTech()?FS.query(FS.collection(fdb,'files'),FS.where('fileId','==',id),FS.where('kind','==','job')):FS.query(FS.collection(fdb,'files'),FS.where('fileId','==',id)));if(q.empty)return null;
      const parts=q.docs.map(d=>d.data()).sort((a,b)=>a.i-b.i);return b64ToBlob(parts.map(p=>p.data).join(''),parts[0].type)},
    delFile:async id=>{const q=await FS.getDocs(FS.query(FS.collection(fdb,'files'),FS.where('fileId','==',id)));const bt=FS.writeBatch(fdb);q.docs.forEach(d=>bt.delete(d.ref));await bt.commit()},
    bulk:async items=>{for(let i=0;i<items.length;i+=400){const b=FS.writeBatch(fdb);items.slice(i,i+400).forEach(([k,o])=>b.set(FS.doc(fdb,k,o.id),clean(o)));await b.commit().catch(fail)}},
    login:()=>AU.signInWithPopup(auth,prov).catch(e=>{
      if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(e.code))return AU.signInWithRedirect(auth,prov);
      if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('تعذّر تسجيل الدخول: '+e.code)}),
    logout:()=>{unsubs.forEach(u=>u());unsubs=[];AU.signOut(auth)}
  };
  AU.getRedirectResult(auth).catch(()=>{});
  AU.onAuthStateChanged(auth,async u=>{
    unsubs.forEach(x=>x());unsubs=[];ME=null;db=blank();
    if(!u){showLogin();return}
    const email=(u.email||'').toLowerCase();let role=null,techId='';
    if(OWNER_EMAILS.includes(email))role='manager';
    else{try{const s=await FS.getDoc(FS.doc(fdb,'users',email));if(s.exists()){role=s.data().role;techId=s.data().techId||''}}catch(e){console.error(e)}}
    if(!role||(role==='tech'&&!techId)){showDenied(email);return}
    ME={email,role,techId,name:u.displayName,photo:u.photoURL};
    gate(`<p class="muted">جاري تحميل البيانات...</p>`);
    const cols=role==='manager'?['clients','techs','contracts','visits','jobs','logs','invoices','jobPrices','letters','users']:['clients','techs','visits','jobs','logs'];
    const loaded=new Set(),need=cols.length+1;
    const mark=k=>{if(loaded.has(k))return scheduleRender();loaded.add(k);if(loaded.size===need){gate(null);if(role==='manager')migrateJobValues();render();setTimeout(checkExpiryNotify,1500)}};
    cols.forEach(k=>unsubs.push(FS.onSnapshot(FS.collection(fdb,k),{includeMetadataChanges:true},snap=>{db[k]=snap.docs.map(d=>k==='users'?{email:d.id,...d.data()}:d.data());const pn=snap.docs.filter(d=>d.metadata.hasPendingWrites).length;if(pn!==(SYNC.pending[k]||0)){SYNC.pending[k]=pn;if(loaded.has(k))scheduleRender()}mark(k)},e=>{console.error(k,e);mark(k)})));
    unsubs.push(FS.onSnapshot(FS.doc(fdb,'meta','settings'),s=>{db.settings={...blank().settings,...(s.exists()?s.data():{})};fixName();mark('settings')},e=>{console.error(e);mark('settings')}));
  });
}
if(MODE==='cloud')startCloud();
else if(MODE==='setup')gate(`<h2 style="justify-content:center">برنامج متابعة الأعمال والصيانة</h2><p class="small">الدخول للبرنامج يتم بحساب <b>Gmail</b> فقط:<br>المدير بحساب الشركة، وكل فني بحسابه.</p><div class="alert" style="justify-content:center">⚙️ البرنامج قيد التجهيز — جاري ربط تسجيل الدخول بجوجل.</div>`);
else render();
</script>
</body>
</html>
